<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ruche-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1526"/>
      <stop offset="100%" stop-color="#131c2e"/>
    </linearGradient>
    <linearGradient id="ruche-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ruche-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#ruche-bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- PDFRuche Hexagon -->
  <g transform="translate(32, 30)">
    <polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="none" stroke="url(#ruche-gold)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Honeycomb cells -->
    <polygon points="0,-9 5.2,-6 5.2,0 0,3 -5.2,0 -5.2,-6" fill="url(#ruche-teal)" opacity="0.9"/>
    <polygon points="-7.8,4.5 -2.6,4.5 -2.6,10.5 -7.8,13 -11,10.5 -11,4.5" fill="url(#ruche-gold)" opacity="0.75"/>
    <polygon points="7.8,4.5 11,4.5 11,10.5 7.8,13 2.6,10.5 2.6,4.5" fill="url(#ruche-teal)" opacity="0.55"/>
    <!-- Bee spark -->
    <circle cx="11" cy="-12" r="2.2" fill="#fbbf24"/>
    <circle cx="16" cy="-6" r="1.4" fill="#2dd4bf" opacity="0.8"/>
  </g>

  <!-- PDF wordmark -->
  <text x="32" y="56" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1">PDF</text>
</svg>
