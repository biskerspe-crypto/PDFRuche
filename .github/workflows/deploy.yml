# GitHub Actions workflow for automatic deployment to GitHub Pages
# Triggers on push to main branch
# Builds the project and deploys the static export to GitHub Pages

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Restore cache for faster builds
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build the project
      # Note: postbuild script auto-decompresses LibreOffice WASM .gz files and copies LICENSE (AGPL)
      - name: Build with Next.js
        run: npm run build
        env:
          # Add any required environment variables here
          NODE_ENV: production

      # AGPL-3.0 compliance: ensure Corresponding Source and LICENSE are in out/
      - name: Copy AGPL LICENSE and verify source offer
        run: |
          ls -lh out/LICENSE.txt out/LICENSE out/MODIFICATIONS.txt 2>&1 || echo "LICENSE check"
          if [ ! -f out/LICENSE.txt ]; then echo "❌ out/LICENSE.txt missing (AGPL §4)"; exit 1; fi
          if ! grep -R "github.com/PDFCraftTool/pdfcraft" out/ > /dev/null; then echo "❌ AGPL source link missing in out/"; exit 1; fi
          if ! grep -R "LICENSE" out/*.html 2>/dev/null | head -1 | grep -q LICENSE; then echo "⚠️ LICENSE link not found in HTML (checking footer)"; fi
          echo "✅ AGPL artifacts verified: LICENSE.txt and source links present"
          echo "Commit: $(git rev-parse --short HEAD) $(date -u +%Y-%m-%dT%H:%M:%SZ)" > out/SOURCE_VERSION.txt
          cat out/SOURCE_VERSION.txt

      # Upload artifact for deployment
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
